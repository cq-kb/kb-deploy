services:
  halo:
    image: registry.fit2cloud.com/halo/halo:2
    container_name: halo
    restart: unless-stopped
    depends_on:
      halodb:
        condition: service_healthy
    volumes:
      - ./data/halo2:/root/.halo2
    environment:
      - JVM_OPTS=-Xmx768m -Xms256m
    command:
      - --spring.r2dbc.url=r2dbc:pool:postgresql://halodb/halo
      - --spring.r2dbc.username=halo
      - --spring.r2dbc.password=${DB_PASSWORD}
      - --spring.sql.init.platform=postgresql
      - --halo.external-url=https://kb.${SITE_DOMAIN}/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  halodb:
    image: postgres:16-alpine
    container_name: halodb
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=halo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=halo
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "halo"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      - SERVER_IP=${SERVER_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - ./data/caddy:/data
      - ../exam-calendar/public:/srv/kao:ro

  # 访问统计（Umami，自托管）：https://stats.<域名>
  # 复用 halodb，库名 umami（scripts/ensure-umami-db.sh 会在部署时自动创建）
  umami:
    image: umamisoftware/umami:3.4.0
    container_name: umami
    restart: unless-stopped
    depends_on:
      halodb:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://halo:${DB_PASSWORD}@halodb:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
      - DISABLE_TELEMETRY=1
      # 统计脚本改名为 /kb.js、上报接口改为 /api/kb，减少被广告拦截插件拦掉的概率
      - TRACKER_SCRIPT_NAME=kb
      - COLLECT_API_ENDPOINT=/api/kb
    mem_limit: 350m

  # 考试日历（代码在 /opt/exam-calendar，见 ~/Personal/exam-calendar）
  exam-calendar:
    build: ../exam-calendar
    container_name: exam-calendar
    restart: unless-stopped
    ports:
      - "8091:8000"            # IP 直连兜底：http://<公网IP>:8091（需安全组放行）
    volumes:
      - ../exam-calendar/public:/srv/public
      - ../exam-calendar/state:/srv/state
      - ../exam-calendar/data/exams.yaml:/srv/data/exams.yaml:ro
    env_file:
      - ../exam-calendar/.env
    mem_limit: 300m
