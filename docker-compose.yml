services:
  halo:
    image: registry.fit2cloud.com/halo/halo:2
    container_name: halo
    restart: unless-stopped
    depends_on:
      halodb:
        condition: service_healthy
    volumes:
      - ./data/halo2:/root/.halo2
    environment:
      # 2C2G 机器内存预算（2026-10-01 假死事故后定）：堆 512m + 元空间 192m，容器硬上限 900m
      # 串行 GC 在 2 核小堆下比默认 G1 省一两百兆常驻内存，流量小时吞吐差异感知不到
      - JVM_OPTS=-Xmx512m -Xms128m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC
    command:
      - --spring.r2dbc.url=r2dbc:pool:postgresql://halodb/halo
      - --spring.r2dbc.username=halo
      - --spring.r2dbc.password=${DB_PASSWORD}
      - --spring.sql.init.platform=postgresql
      - --halo.external-url=https://kb.${SITE_DOMAIN}/
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  halodb:
    image: postgres:16-alpine
    container_name: halodb
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=halo
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=halo
    # 小内存机器：压低 PG 缓冲区（给 halo 和 umami 两个库用，默认 128MB 太多）
    command: postgres -c shared_buffers=32MB -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=50
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "halo"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      - SERVER_IP=${SERVER_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - ./data/caddy:/data
      - ../exam-calendar/public:/srv/kao:ro
    mem_limit: 96m

  # 访问统计（Umami，自托管）：https://stats.<域名>
  # 复用 halodb，库名 umami（scripts/ensure-umami-db.sh 会在部署时自动创建）
  umami:
    image: umamisoftware/umami:3.4.0
    container_name: umami
    restart: unless-stopped
    depends_on:
      halodb:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://halo:${DB_PASSWORD}@halodb:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
      - DISABLE_TELEMETRY=1
      # 统计脚本改名为 /kb.js、上报接口改为 /api/kb，减少被广告拦截插件拦掉的概率
      - TRACKER_SCRIPT_NAME=kb
      - COLLECT_API_ENDPOINT=/api/kb
    # 2026-10-01 实测：空闲 ~150m，第一条上报时冷初始化（加载 GeoLite2 地理库 + Prisma + 路由代码）一次性 +180m，
    # 之后稳定在 ~310m。350m 装不下这一跳 → 容器内缓存抖动 → 读盘打满拖垮整机。500m 是测出来的安全值。
    # memswap_limit 让它能用到 swap（需宿主机 vm.swappiness>0，阿里云镜像 /etc/sysctl.conf 默认写死 0，已改 100）
    mem_limit: 500m
    memswap_limit: 1g

  # 考试日历（代码在 /opt/exam-calendar，见 ~/Personal/exam-calendar）
  exam-calendar:
    build: ../exam-calendar
    container_name: exam-calendar
    restart: unless-stopped
    ports:
      - "8091:8000"            # IP 直连兜底：http://<公网IP>:8091（需安全组放行）
    volumes:
      - ../exam-calendar/public:/srv/public
      - ../exam-calendar/state:/srv/state
      - ../exam-calendar/data/exams.yaml:/srv/data/exams.yaml:ro
    env_file:
      - ../exam-calendar/.env
    mem_limit: 200m   # 实测常驻 ~80m
