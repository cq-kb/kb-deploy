# push 到 main 后，把配置同步到服务器并让改动生效。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   DEPLOY_HOST  服务器公网 IP（47.107.190.39）
#   DEPLOY_USER  SSH 用户（root）
#   DEPLOY_KEY   SSH 私钥（见 README「自动部署」）
name: Deploy to server

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "dev/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # printf 保证末尾有换行；tr 去掉粘贴时可能混入的 \r
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 私钥格式自检：不合法就在这里明确失败，而不是等到 rsync 报一串看不懂的错
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::DEPLOY_KEY 不是合法的 OpenSSH 私钥，请重新粘贴（含 BEGIN/END 行）"; exit 1; }
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync config to server
        run: |
          rsync -avz --delete \
            --exclude '.env' --exclude 'data/' --exclude '.git/' --exclude '.github/' \
            --exclude 'dev/' --exclude 'README.md' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/kb-deploy/"

      # 服务器在国内，直接从 Docker Hub 拉镜像会卡死；通过 SSH 传又受服务器几 Mbps 入网带宽限制。
      # 所以：缺的镜像由 runner 拉好，推到阿里云 ACR（深圳，个人版），服务器再走阿里云内网从 ACR 拉回来并打回原名。
      # 需要组织 Secrets：ACR_REGISTRY（公网域名 crpi-xxx.cn-shenzhen.personal.cr.aliyuncs.com）、ACR_USERNAME、ACR_PASSWORD
      - name: Ship missing images via ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_NAMESPACE: cq-kb
        run: |
          set -e
          missing=""
          for img in $(grep -E '^\s+image:' docker-compose.yml | awk '{print $2}'); do
            if ssh "$SSH_TARGET" "docker image inspect '$img' >/dev/null 2>&1"; then
              echo "已有：$img"
            else
              missing="$missing $img"
            fi
          done
          [ -z "$missing" ] && { echo "服务器镜像齐全，跳过"; exit 0; }

          echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          # 服务器走内网域名：crpi-xxx.cn-shenzhen... -> crpi-xxx-vpc.cn-shenzhen...
          ACR_VPC="$(echo "$ACR_REGISTRY" | sed -E 's/^([^.]+)\./\1-vpc./')"

          for img in $missing; do
            name="$(basename "${img%%:*}")"       # umamisoftware/umami:3.4.0 -> umami
            tag="${img##*:}"                        # -> 3.4.0
            acr="$ACR_REGISTRY/$ACR_NAMESPACE/$name:$tag"
            echo "::group::$img -> $acr"
            docker pull -q "$img"
            docker tag "$img" "$acr"
            docker push -q "$acr"
            ssh "$SSH_TARGET" "docker pull -q '$ACR_VPC/$ACR_NAMESPACE/$name:$tag' && docker tag '$ACR_VPC/$ACR_NAMESPACE/$name:$tag' '$img' && docker image inspect '$img' >/dev/null"
            echo "::endgroup::"
          done

      - name: Apply
        run: |
          ssh "$SSH_TARGET" '
            set -e
            cd /opt/kb-deploy
            docker compose up -d --quiet-pull halodb
            bash scripts/ensure-umami-db.sh
            docker compose up -d --quiet-pull --remove-orphans
            docker compose restart caddy
            docker compose ps
          '
