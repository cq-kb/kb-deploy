# 本地开发环境：在 Mac 上跑一个 Halo，用内置 H2 数据库，端口 8090。
# 把 ../../kb-theme 挂进 Halo 的主题目录，主题仓库里 `pnpm dev` 构建出的 templates/ 会被直接读取。
#
#   cd kb-deploy/dev && docker compose up -d
#   打开 http://localhost:8090/console 初始化（本地数据只在 dev/data/，与线上无关）
#   后台 → 主题 → 启用「KB（知识库）」
services:
  halo-dev:
    image: registry.fit2cloud.com/halo/halo:2
    container_name: halo-dev
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data:/root/.halo2
      - ../../kb-theme:/root/.halo2/themes/kb-theme
    environment:
      - JVM_OPTS=-Xmx1g -Xms256m
    command:
      - --halo.external-url=http://localhost:8090/
